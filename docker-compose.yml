services:
  be-uml:
    build: .
    container_name: uml_be
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: uml_postgres
      SOCKET_SERVER_HOST: 0.0.0.0
      SOCKET_SERVER_PORT: 9092
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
      - "9092:9092"
    depends_on:
      - uml_postgres

  uml_postgres:
    image: postgres:15-alpine
    container_name: uml_postgres

    restart: always

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: uml_pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "${PGADMIN_PORT}:80"

    depends_on:
      - uml_postgres

  redis:
    image: redis:7-alpine
    container_name: uml_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: uml_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: uml-anythingllm
    restart: always
    ports:
      - "3001:3001"
    cap_add:
      - SYS_ADMIN
    environment:
      - STORAGE_DIR=/app/server/storage
    volumes:
      - anythingllm_data:/app/server/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  anythingllm_data: